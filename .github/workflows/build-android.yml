# Android-Testbuild per Knopfdruck: Actions -> Build Android -> Run workflow.
# Gebaut wird auf den Servern von Expo (EAS Build). Den Download-Link (APK) zeigt
# expo.dev unter dem Projekt -> Builds; Expo schickt ausserdem eine Mail.
#
# Profil "preview" = APK zum direkten Installieren, verbunden mit Staging.
name: Build Android

on:
  workflow_dispatch:

jobs:
  build:
    name: APK (Profil preview)
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Konfiguration pruefen
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::Secret EXPO_TOKEN fehlt. Einrichtung: docs/lernen/06-m5-auslieferung.md"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhaengigkeiten installieren
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build starten
        run: eas build --platform android --profile preview --non-interactive --no-wait
