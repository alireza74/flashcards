# Prueft bei jedem Push und Pull Request, dass die App baut und die Tests gruen sind.
# Ab M1 kommt ein zweiter Job dazu: Supabase starten, Migrationen einspielen, pgTAP-Tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (Lint, Typen, Tests, Web-Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typpruefung
        run: npm run typecheck

      - name: Tests
        run: npm test -- --ci

      - name: Web-Build
        run: npm run build:web
