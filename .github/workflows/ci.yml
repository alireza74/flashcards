# Prueft bei jedem Push und Pull Request, dass die App baut und die Tests gruen sind.
# Zwei Jobs laufen parallel: frontend (App) und database (Migrationen, RLS-Tests, Typen).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (Lint, Typen, Tests, Web-Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typpruefung
        run: npm run typecheck

      - name: Tests
        run: npm test -- --ci

      - name: Web-Build
        run: npm run build:web

  database:
    name: Datenbank (Migrationen, RLS-Tests, Typen)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Abhaengigkeiten installieren (Supabase-CLI, Prettier)
        run: npm ci

      - name: Datenbank starten und alle Migrationen einspielen
        run: npx supabase db start

      - name: pgTAP-Tests (Mandantentrennung, Rollen, Registrierung)
        run: npm run db:test

      - name: Datenbank-Linter
        run: npm run db:lint

      - name: TypeScript-Typen passen zum Schema
        run: |
          npm run db:types
          git diff --exit-code -- ../frontend/src/core/supabase/database.types.ts
